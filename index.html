<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>今日整体 · A股资金流复盘</title>
<link rel="stylesheet" href="assets/site.css" />
</head>
<body>
<script src="data.js"></script>
<script src="assets/base.js"></script>
<script>
(function(){
  const {D,$,fmt,fmt0,cls,esc,mount,barLine,rows} = window.APP;
  mount({page:'index.html', title:'A股资金流 · 今日整体'});
  const t = D.today || {}, rg = D.regime || {}, s = D.sentiment || {};
  const m5 = (D.market||[]).slice(-5).reduce((a,x)=>a+x.v,0);
  const m20 = (D.market||[]).slice(-20).reduce((a,x)=>a+x.v,0);
  const top = (D.mainline||[])[0];

  const body = $('body');
  body.innerHTML = `
    <div class="kpis">
      ${kpi('今日主力净流入', fmt0(t.total)+' 亿', '一级行业合计 ・ 细分 '+fmt0(t.detailSum||0)+' 亿', cls(t.total))}
      ${kpi('近5日累计', fmt0(m5)+' 亿', '近20日 '+fmt0(m20)+' 亿', cls(m5))}
      ${kpi('流入 / 流出板块', (t.inCount||0)+' / '+(t.outCount||0), '共 '+((t.inCount||0)+(t.outCount||0))+' 个细分板块', '')}
      ${kpi('第一主线题材', top?esc(top.theme):'—', top?('涨停 '+(top.zt||0)+' 家 ・ 连板 '+(top.lb||0)+' 只 ・ '+esc(top.high||'')):'', '')}
    </div>

    <div class="grid g21">
      <div class="card">
        <h2>全市场主力净流入（近30个交易日）<em>单位：亿元 ・ 红=流入 绿=流出</em></h2>
        <svg class="chart" id="mchart" viewBox="0 0 900 250" preserveAspectRatio="none"></svg>
      </div>
      <div class="card">
        <h2>市场状态<em>${esc(rg.threeX||'')}</em></h2>
        <div id="breadth"></div>
        <div class="note">${esc(rg.rule||'')}</div>
        <div class="sub">今日热点题材（前 4）</div>
        <div class="rows" id="miniThemes"></div>
        <div class="note" style="margin-top:10px"><a href="duanxian.html">→ 完整短线情绪与题材榜</a></div>
      </div>
    </div>

    <div class="grid g2">
      <div class="card"><h2>今日净流入 TOP12</h2><div class="rows" id="topRows"></div></div>
      <div class="card"><h2>今日净流出 TOP12</h2><div class="rows" id="botRows"></div></div>
    </div>

    <div class="grid g2">
      <div class="card"><h2>12日累计净流入 TOP12</h2><div class="rows" id="cumUp"></div></div>
      <div class="card"><h2>12日累计净流出 TOP12</h2><div class="rows" id="cumDn"></div></div>
    </div>

    <div class="card">
      <h2>轮动节奏<em>相邻交易日 TOP10 重合度（Jaccard）</em></h2>
      <svg class="chart" id="rchart" viewBox="0 0 900 200" preserveAspectRatio="none"></svg>
      <div class="note"><a href="qushi.html">→ 趋势波段：主线监控与累计资金</a>　<a href="guojia.html">→ 国家队 / ETF 申赎</a></div>
    </div>`;

  function kpi(k,v,s2,c){return `<div class="kpi"><div class="k">${k}</div><div class="v ${c||''}">${v}</div><div class="s">${esc(s2||'')}</div></div>`;}

  barLine($('mchart'), D.market||[]);

  // 宽度
  const tot=(t.inCount||0)+(t.outCount||0)||1, pct=(t.inCount||0)/tot*100;
  $('breadth').innerHTML = `
    <div style="display:flex;height:24px;border-radius:7px;overflow:hidden;margin-bottom:9px">
      <div style="width:${pct}%;background:linear-gradient(90deg,rgba(240,72,62,.6),#f0483e)"></div>
      <div style="flex:1;background:linear-gradient(90deg,#22b573,rgba(34,181,115,.55))"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px">
      <span class="up">流入 ${t.inCount||0} 个（${pct.toFixed(0)}%）</span>
      <span class="dn">流出 ${t.outCount||0} 个</span>
    </div>`;

  const th=(D.themes||[]).slice(0,4);
  const tmx=Math.max(...th.map(x=>x.zt||0),1);
  $('miniThemes').innerHTML = th.map(x=>`<div class="row"><div class="nm">${esc(x.name)}</div>
    <div class="bar"><i class="up" style="width:${(x.zt/tmx*100).toFixed(0)}%"></i></div>
    <div class="val up">${x.zt}家<span class="pct">${x.lb}连板</span></div></div>`).join('');

  rows($('topRows'), t.top||[], true);
  rows($('botRows'), t.bottom||[], true);
  rows($('cumUp'), (D.cum||{}).up||[], false);
  rows($('cumDn'), (D.cum||{}).down||[], false);

  (function(){
    const d=D.rotation||[]; if(!d.length) return;
    const W=900,H=200,padL=40,padB=26,padT=12,max=.35,n=d.length,bw=(W-padL-10)/n;
    let s2='';
    [0,.1,.2,.3].forEach(k=>{
      const y=H-padB-(k/max)*(H-padT-padB);
      s2+=`<line class="axis" x1="${padL}" x2="${W-4}" y1="${y}" y2="${y}" opacity="${k===0?.9:.3}"/>`;
      s2+=`<text x="${padL-6}" y="${y+3}" text-anchor="end">${k.toFixed(1)}</text>`;
    });
    d.forEach((p,i)=>{
      const h=Math.min(p.j,max)/max*(H-padT-padB), x=padL+i*bw+bw*.2, w=bw*.6;
      s2+=`<rect x="${x.toFixed(1)}" y="${(H-padB-h).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,.8).toFixed(1)}" rx="2" fill="#4a8cff" opacity=".75"><title>${p.d} ${p.j.toFixed(2)}</title></rect>`;
      if(i%4===0) s2+=`<text x="${(x+w/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${p.d.slice(5)}</text>`;
    });
    $('rchart').innerHTML=s2;
  })();
})();
</script>
</body>
</html>
