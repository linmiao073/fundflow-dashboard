<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>国家队 / ETF · A股资金流复盘</title>
<link rel="stylesheet" href="assets/site.css" />
</head>
<body>
<script src="data.js"></script>
<script src="assets/base.js"></script>
<script>
(function(){
  const {D,$,fmt,fmt0,cls,esc,mount,barLine} = window.APP;
  mount({page:'guojia.html', title:'国家队 · ETF 申赎与宽基资金'});
  const body=$('body');

  body.innerHTML = `
    <div class="card mb">
      <h2>ETF 净申购（一级市场 · 申赎口径）<em>份额变化×收盘价 ・ 单位亿元 ・ 交易所日度份额</em></h2>
      <div id="subTabs" style="display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 12px"></div>
      <div id="subKpi" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px"></div>
      <svg class="chart" id="subChart" viewBox="0 0 900 250" preserveAspectRatio="none"></svg>
      <div class="legend"><span><i style="background:#f0483e"></i>净申购</span><span><i style="background:#22b573"></i>净赎回</span><span><i style="background:#4a8cff"></i>累计</span></div>
      <div class="note" id="subNote"></div>
      <div class="tw"><table id="subTable" style="margin-top:8px"></table></div>
    </div>

    <div class="card mb">
      <h2>沪深300ETF · 二级市场主力净流入<em>东财大单口径（超大单+大单）・ 与申赎口径不同</em></h2>
      <svg class="chart" id="chartTotal" viewBox="0 0 900 250" preserveAspectRatio="none"></svg>
      <div class="legend"><span><i style="background:#f0483e"></i>净流入</span><span><i style="background:#22b573"></i>净流出</span><span><i style="background:#4a8cff"></i>累计</span></div>
      <div class="note" id="hsNote"></div>
    </div>

    <div class="card mb">
      <h2>每支 ETF 每日净流入<em>缩略图，红涨绿跌</em></h2>
      <div class="sm-grid" id="smGrid"></div>
    </div>

    <div class="card mb">
      <h2>每日 × 每支 热力图<em>颜色深浅=净流入强度</em></h2>
      <div class="tw"><table class="hm" id="hmTable"></table></div>
    </div>

    <div class="grid g21">
      <div class="card"><h2>监控 ETF 今日主力净流入</h2><div class="tw"><table id="etfTable"></table></div></div>
      <div class="card"><h2>今日个股主力净流入 TOP10</h2><div class="tw"><table id="stockTable"></table></div></div>
    </div>`;

  // ---- 申赎 tabs
  (function(){
    const S=D.sub; if(!S||!S.tabs||!S.tabs.length){ $('subNote').textContent='暂无申赎数据（需先运行 build_etf_subflow.py）'; return; }
    const order=['all','broad','industry','gold'];
    const tabs=order.map(k=>S.tabs.find(t=>t.key===k)).filter(Boolean);
    if(!tabs.length) return;
    let active=tabs[0].key;
    const fmtS=v=>(v==null?'—':(v>0?'+':'')+v.toFixed(1));

    function draw(t){
      const rows=t.series.filter(r=>r.v!=null);
      const W=900,H=250,padL=50,padR=54,padB=28,padT=14;
      const n=rows.length||1;
      const maxV=Math.max(...rows.map(r=>Math.abs(r.v||0)),1);
      const cums=rows.map(r=>r.cum||0);
      let cMin=Math.min(...cums,0),cMax=Math.max(...cums,0);
      if(cMax-cMin<1){cMax+=1;cMin-=1;}
      const zero=padT+(H-padT-padB)/2, sc=(H-padT-padB)/2/maxV, bw=(W-padL-padR)/n;
      let s='';
      [-1,-.5,0,.5,1].forEach(k=>{
        const y=zero-k*(H-padT-padB)/2;
        s+=`<line class="axis" x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" opacity="${k===0?.9:.3}"/>`;
        s+=`<text x="${padL-7}" y="${y+3}" text-anchor="end">${(k*maxV).toFixed(0)}</text>`;
      });
      [cMin,(cMin+cMax)/2,cMax].forEach(k=>{
        const y=H-padB-((k-cMin)/(cMax-cMin))*(H-padT-padB);
        s+=`<text x="${W-padR+7}" y="${y+3}" text-anchor="start" fill="#6f8ab5">${k.toFixed(0)}</text>`;
      });
      rows.forEach((r,i)=>{
        const x=padL+i*bw+bw*.18,w=bw*.64,h=Math.abs(r.v)*sc,y=r.v>=0?zero-h:zero;
        s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,.6).toFixed(1)}" rx="1.5" fill="${r.v>=0?'#f0483e':'#22b573'}" opacity=".85"><title>${r.d} 净申购 ${fmtS(r.v)} 亿 ・ 累计 ${fmtS(r.cum)} 亿</title></rect>`;
        if(i%4===0) s+=`<text x="${(x+w/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${r.d.slice(5)}</text>`;
      });
      const pts=rows.map((r,i)=>`${(padL+i*bw+bw/2).toFixed(1)},${(H-padB-((r.cum-cMin)/(cMax-cMin))*(H-padT-padB)).toFixed(1)}`).join(' ');
      s+=`<polyline points="${pts}" fill="none" stroke="#4a8cff" stroke-width="1.6" opacity=".9"/>`;
      $('subChart').innerHTML=s;
    }

    function kpi(t){
      const col=v=>(v||0)>=0?'var(--up)':'var(--dn)';
      const last=t.series.filter(r=>r.v!=null).slice(-1)[0];
      const card=(k,v,c)=>`<div style="background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:120px"><div style="font-size:12px;color:var(--dim)">${k}</div><div style="font-size:16px;font-weight:600;color:${c}">${v}</div></div>`;
      $('subKpi').innerHTML = card('最近一日 '+(last?last.d.slice(5):''), fmtS(t.today)+' 亿', col(t.today))
        + card('近 5 日', fmtS(t.d5)+' 亿', col(t.d5))
        + card('近 20 日', fmtS(t.d20)+' 亿', col(t.d20))
        + card('成分 ETF', t.n+' 只', 'var(--txt)');
    }

    function members(t){
      $('subTable').innerHTML='<thead><tr><th>代码</th><th>名称</th><th>净申购(亿)</th><th>份额(亿份)</th><th>份额变化(亿份)</th></tr></thead><tbody>'
        + (t.members||[]).map(m=>`<tr><td>${m.code}</td><td style="text-align:left">${esc(m.name)}</td>
          <td class="${m.v>=0?'up':'dn'}">${fmtS(m.v)}</td><td>${m.share.toFixed(2)}</td>
          <td class="${m.dshare>=0?'up':'dn'}">${m.dshare>0?'+':''}${m.dshare.toFixed(2)}</td></tr>`).join('')+'</tbody>';
    }

    function render(){
      $('subTabs').innerHTML=tabs.map(t=>{
        const on=t.key===active;
        return `<button data-k="${t.key}" style="cursor:pointer;border:1px solid ${on?'var(--acc)':'var(--line)'};background:${on?'rgba(74,140,255,.16)':'var(--card2)'};color:${on?'var(--acc)':'var(--dim)'};border-radius:9px;padding:6px 14px;font-size:13px">${t.name}</button>`;
      }).join('');
      const t=tabs.find(x=>x.key===active)||tabs[0];
      draw(t); kpi(t); members(t);
      const last=t.series.filter(r=>r.v!=null).slice(-1)[0];
      $('subNote').textContent=`口径：净申购 =（当日份额 − 前一日份额）× 收盘价，反映一级市场申购赎回；份额取交易所日度规模（${last?last.d:''}，T+1 确认）。与“二级市场主力净流入”不是同一指标，两者方向常相反。`;
      [...$('subTabs').querySelectorAll('button')].forEach(b=>b.onclick=()=>{active=b.dataset.k;render();});
    }
    render();
  })();

  // ---- 沪深300 二级市场
  (function(){
    const S=D.etfSeries; if(!S) return;
    barLine($('chartTotal'), S.hs300||S.total||[]);
    $('hsNote').textContent = '当前口径：' + (S.hs300Names||[]).join('、') + '（沪深300ETF 家族，不含创业板/科创/半导体）。柱=当日主力净流入，线=累计。';
  })();

  // ---- 缩略图 + 热力图
  (function(){
    const S=D.etfSeries; if(!S||!S.dates) return;
    const mxAll=Math.max(...S.rows.reduce((a,r)=>a.concat(r.flows.map(v=>Math.abs(v||0))),[0]),1);
    $('smGrid').innerHTML=S.rows.map(r=>{
      const W=220,H=50,n=r.flows.length||1,bw=W/n;
      let bars='';
      r.flows.forEach((v,i)=>{
        if(v==null) return;
        const hh=Math.abs(v)/mxAll*(H/2-2), x=i*bw+bw*.2, w=bw*.6, y=v>=0?H/2-hh:H/2;
        bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(hh,.5).toFixed(1)}" fill="${v>=0?'#f0483e':'#22b573'}" opacity=".85"><title>${S.dates[i]} ${fmt(v)} 亿</title></rect>`;
      });
      const last=[...r.flows].reverse().find(v=>v!=null)||0;
      const s5=r.flows.slice(-5).reduce((a,v)=>a+(v||0),0);
      return `<div class="sm${r.code==='510300'?' hl':''}">
        <div class="t"><b>${esc(r.name)}</b><s class="${cls(last)}">今日 ${fmt(last)}</s></div>
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="#2a3446" stroke-width="1"/>${bars}</svg>
        <div class="f"><span class="${cls(s5)}">5日 ${fmt(s5)}</span><span>${r.code}</span></div></div>`;
    }).join('');

    const dates=S.dates, rows=S.rows;
    const mx=Math.max(...rows.reduce((a,r)=>a.concat(r.flows.map(v=>Math.abs(v||0))),[0]),1);
    const tmx=Math.max(...(S.total||[]).map(t=>Math.abs(t.v)),1);
    let h='<thead><tr><th></th>'+dates.map(d=>`<th>${d.slice(5)}</th>`).join('')+'</tr></thead><tbody>';
    rows.forEach(r=>{
      h+=`<tr><td class="nm">${esc(r.name)}</td>`;
      r.flows.forEach(v=>{
        if(v==null){h+='<td class="c" style="background:rgba(255,255,255,.03)"></td>';return;}
        const a=Math.min(Math.abs(v)/mx,1);
        const bg=v>=0?`rgba(240,72,62,${(.10+.78*a).toFixed(2)})`:`rgba(34,181,115,${(.10+.72*a).toFixed(2)})`;
        h+=`<td class="c" style="background:${bg}">${Math.abs(v)>=1?v.toFixed(1):v.toFixed(2)}</td>`;
      });
      h+='</tr>';
    });
    h+='<tr><td class="nm" style="color:#ffca6b">合计</td>';
    (S.total||[]).forEach(t=>{
      const a=Math.min(Math.abs(t.v)/tmx,1);
      const bg=t.v>=0?`rgba(240,72,62,${(.10+.78*a).toFixed(2)})`:`rgba(34,181,115,${(.10+.72*a).toFixed(2)})`;
      h+=`<td class="c" style="background:${bg};font-weight:600">${t.v.toFixed(0)}</td>`;
    });
    $('hmTable').innerHTML=h+'</tr></tbody>';
  })();

  // ---- ETF 表
  (function(){
    let h='<thead><tr><th>ETF</th><th>涨跌%</th><th>成交额</th><th>量比</th><th>主力净流入</th><th>近5日</th></tr></thead><tbody>';
    (D.etf||[]).forEach(e=>{
      h+=`<tr class="${e.isIndex?'idx':''}"><td>${esc(e.name)}<span style="color:#5d6879;font-size:11px"> ${e.code}</span></td>
        <td class="${cls(e.pct)}">${e.pct==null?'-':fmt(e.pct,2)}</td>
        <td>${e.amount==null?'-':e.amount.toFixed(1)+'亿'}</td>
        <td>${e.vr==null?'-':e.vr.toFixed(2)+'x'}</td>
        <td class="${cls(e.flow)}">${fmt(e.flow,2)}</td>
        <td class="${cls(e.cum5)}">${fmt(e.cum5)}</td></tr>`;
    });
    $('etfTable').innerHTML=h+'</tbody>';
  })();

  // ---- 个股
  (function(){
    let h='<thead><tr><th>个股</th><th>现价</th><th>涨跌%</th><th>主力净流入</th></tr></thead><tbody>';
    (D.stocks||[]).forEach(s=>{
      h+=`<tr><td>${esc(s.name)}<span style="color:#5d6879;font-size:11px"> ${s.code}</span></td>
        <td>${s.price}</td><td class="${cls(s.pct)}">${fmt(s.pct,2)}</td>
        <td class="${cls(s.v)}">${fmt(s.v)}</td></tr>`;
    });
    $('stockTable').innerHTML=h+'</tbody>';
  })();
})();
</script>
</body>
</html>
